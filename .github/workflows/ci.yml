name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff, Mypy, Pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      # Embedding weights download here (ADR-0003). spaCy models are wheels, cached by uv.
      ESFAKE_MODELS_DIR: ${{ github.workspace }}/.cache/models
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Cache models
        uses: actions/cache@v6
        with:
          path: .cache/models
          key: models-${{ hashFiles('config/models.yaml') }}

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

      - name: Evaluation gate (stub until EF-08)
        run: uv run esfake eval
      - name: Red-team gate (stub until EF-17)
        run: uv run esfake redteam

  web:
    name: Web (ESLint, Next.js build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
