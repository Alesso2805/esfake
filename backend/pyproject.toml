[project]
name = "esfake"
version = "0.1.0"
description = "¿EsFake? — scam message checker for Peru"
authors = [
    { name = "Alessandro David", email = "89119823+Alesso2805@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
esfake = "esfake.cli.main:app"

[build-system]
requires = ["uv_build>=0.11.25,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "PT", "RUF",
    "ASYNC", # blocking calls inside async code
    "DTZ",   # naive datetimes; time comes from the injected Clock (CLAUDE.md rule 13)
    "TID",   # banned imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Revisions are autogenerated and reviewed; their long DDL lines stay as Alembic writes them.
"migrations/versions/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# pgvector ships no type information (no py.typed marker).
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.alembic]
# Migrations run as esfake_owner; the URL comes from MIGRATIONS_DATABASE_URL (migrations/env.py).
script_location = "%(here)s/migrations"
file_template = "%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
